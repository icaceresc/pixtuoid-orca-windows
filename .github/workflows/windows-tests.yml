name: Windows adapter tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Orca projection, hierarchy and plugin manifest (offline)
        run: python -B -m unittest -v test_oficina test_instalar
      - name: Check the plugin worker parses
        run: node --check plugin/worker.mjs
